version: '3.8'

services:
  backend:
    build:
      context: ./backend/server
      dockerfile: Dockerfile
    container_name: wevn_backend
    ports:
      - "8000:8000"
    volumes:
      - wevn_db_data:/app/db
      - wevn_model_cache:/__models__
    environment:
      # Use host.docker.internal to access Ollama running on the host machine
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: wevn_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always

volumes:
  wevn_db_data:
  wevn_model_cache:
